
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Make Payment</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* ==============================
       PAYMENT LOADING POPUP
    ============================== */

    .payment-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.65);

      padding: 20px;
    }

    .payment-loader.hidden {
      display: none;
    }

    .loader-box {
      width: 100%;
      max-width: 380px;

      background: #ffffff;
      border-radius: 20px;

      padding: 35px 25px;

      text-align: center;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .spinner {
      width: 52px;
      height: 52px;

      margin: 0 auto 20px;

      border: 5px solid #e5e7eb;
      border-top-color: #2563eb;

      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-box h3 {
      margin: 0 0 10px;

      font-size: 24px;

      color: #111827;
    }

    .loader-box p {
      margin: 0;

      color: #6b7280;

      line-height: 1.5;
    }


    /* ==============================
       SUCCESS / FAILED POPUP
    ============================== */

    .payment-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.65);

      padding: 20px;
    }

    .payment-popup-overlay.show {
      display: flex;
    }

    .payment-popup {
      width: 100%;
      max-width: 380px;

      background: #ffffff;

      border-radius: 20px;

      padding: 35px 25px;

      text-align: center;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);

      animation: popupIn 0.25s ease;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup-icon {
      width: 75px;
      height: 75px;

      margin: 0 auto 20px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      font-size: 45px;
      font-weight: bold;
    }

    .success-icon {
      background: #22c55e;
    }

    .failed-icon {
      background: #ef4444;
    }

    .payment-popup h2 {
      margin: 0 0 12px;

      color: #111827;

      font-size: 27px;
    }

    .payment-popup p {
      margin: 0 0 25px;

      color: #6b7280;

      line-height: 1.5;
    }

    .payment-popup button {
      width: 100%;

      padding: 14px 20px;

      border: none;
      border-radius: 10px;

      background: #2563eb;

      color: #ffffff;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .payment-popup button:hover {
      opacity: 0.9;
    }
  </style>
</head>


<body>

  <main class="payment-container">

    <section class="payment-card">

      <h1>Make Payment</h1>

      <p class="subtitle">
        Enter your details to continue with payment.
      </p>


      <form id="paymentForm">

        <div class="form-group">

          <label for="name">
            Full Name
          </label>

          <input
            type="text"
            id="name"
            placeholder="John Doe"
            required
          >

        </div>


        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="john@example.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="0712345678"
            required
          >

        </div>


        <div class="form-group">

          <label for="amount">
            Amount (KES)
          </label>

          <input
            type="number"
            id="amount"
            min="1"
            step="0.01"
            placeholder="1500"
            required
          >

        </div>


        <button
          type="submit"
          id="payButton"
        >
          Pay with PesaPal
        </button>


        <p id="message"></p>

      </form>

    </section>

  </main>


  <!-- ==============================
       LOADING POPUP
  ============================== -->

  <div
    id="paymentLoader"
    class="payment-loader hidden"
  >

    <div class="loader-box">

      <div class="spinner"></div>

      <h3 id="loaderTitle">
        Processing Payment
      </h3>

      <p id="loaderMessage">
        Please wait...
      </p>

    </div>

  </div>


  <!-- ==============================
       SUCCESS POPUP
  ============================== -->

  <div
    id="paymentSuccessPopup"
    class="payment-popup-overlay"
  >

    <div class="payment-popup">

      <div class="popup-icon success-icon">
        ✓
      </div>

      <h2>
        Payment Successful!
      </h2>

      <p>
        Your payment has been received successfully.
      </p>

      <button id="closeSuccessPopup">
        Done
      </button>

    </div>

  </div>


  <!-- ==============================
       FAILED POPUP
  ============================== -->

  <div
    id="paymentFailedPopup"
    class="payment-popup-overlay"
  >

    <div class="payment-popup">

      <div class="popup-icon failed-icon">
        ×
      </div>

      <h2>
        Payment Failed
      </h2>

      <p>
        Your payment was not completed.
        Please try again.
      </p>

      <button id="closeFailedPopup">
        Try Again
      </button>

    </div>

  </div>


  <!-- ONLY ONE JAVASCRIPT FILE -->

  <script src="app.js"></script>

</body>
</html>
